# =============================================================================
# LITEDOCS - DOCKER COMPOSE (LOCAL DEVELOPMENT)
# =============================================================================
#
# This file sets up f0 for local development and testing.
#
# Usage:
#   docker-compose up        # Start in foreground
#   docker-compose up -d     # Start in background
#   docker-compose down      # Stop and remove containers
#   docker-compose logs -f   # Follow logs
#
# The content and private directories are mounted as volumes,
# so changes will be reflected immediately.

version: '3.8'

services:
  f0:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_NAME: f0
        NUXT_PUBLIC_SITE_DESCRIPTION: Documentation
    
    ports:
      - "3000:3000"
    
    # Mount content directories for live editing
    volumes:
      - ./content:/app/content:ro
      - ./private:/app/private:ro
    
    # Environment variables
    # Use the NUXT_* names: only they override the app's runtime config when
    # the container starts. A plain AUTH_MODE or JWT_SECRET set here is ignored
    # at runtime (an AUTH_MODE=private set that way leaves the site public).
    environment:
      # Authentication mode: 'public' or 'private'
      - NUXT_AUTH_MODE=public
      
      # JWT secret (CHANGE IN PRODUCTION!)
      - NUXT_JWT_SECRET=dev-secret-change-in-production
      
      # AWS SES (required for private mode)
      # - NUXT_AWS_REGION=us-east-1
      # - NUXT_AWS_ACCESS_KEY_ID=your-access-key
      # - NUXT_AWS_SECRET_ACCESS_KEY=your-secret-key
      # - NUXT_EMAIL_FROM=no-reply@example.com
      
      # Site metadata (set the URL: canonical links, sitemap and feeds use it)
      - NUXT_PUBLIC_SITE_NAME=f0
      - NUXT_PUBLIC_SITE_DESCRIPTION=Documentation
      # - NUXT_PUBLIC_SITE_URL=https://docs.example.com
      
      # Google Analytics (optional)
      # - NUXT_PUBLIC_GTAG_ID=G-XXXXXXXXXX
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/_ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

